esphome:
  name: "b2500"
  friendly_name: "B2500"
  devices:
    - id: b2500_device_1
      name: "B2500"
    - id: b2500_device_2
      name: "B2500D"

esp32:
  board: "esp32-s3-devkitc-1"
  variant: "esp32s3"
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 40ms
    active: false

# Enable logging
logger:
  level: INFO
ota:
  - platform: esphome
    password: "my_ota_password"
external_components:
  - source:
      type: git
      url: https://github.com/tomquist/esphome-b2500
      ref: "main"
    refresh: 0s
    components: [b2500]

wifi:
  ssid: "doreen1"
  password: "2DP3UGGRU3GZFKLM"
  reboot_timeout: 0s
  fast_connect: True
  manual_ip:
    static_ip: "192.168.178.97"
    gateway: "192.168.178.1"
    subnet: "255.255.255.0"
    dns1: "192.168.178.1"
  on_connect:
    - logger.log:
        level: INFO
        format: "Connected to WiFi. Starting BLE scan."
  on_disconnect:
    - logger.log:
        level: INFO
        format: "Disconnected from WiFi. Stopping BLE scan."
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "ESPHome-b2500"
web_server:
  port: 80
  version: 3
captive_portal:

mqtt:
  keepalive: 60s
  reboot_timeout: 0s
  buffer_size: 512
  rx_buffer_size: 512
  id: mqtt_client
  broker: "192.168.178.98"
  port: 1883
  username: "mqtt-user"
  password: "ghmue001"
  discovery: True
  reboot_timeout: 0s
  topic_prefix: "b2500"
  log_topic: "b2500/debug"
  on_connect:
    - logger.log:
        level: INFO
        format: "MQTT connected"
  on_disconnect:
    - logger.log:
        level: INFO
        format: "MQTT disconnected"
  on_message:
    - topic: "b2500/1/charge_mode/set"
      then:
        - b2500.set_charge_mode:
            id: b2500_1
            charge_mode: !lambda "return x;"
    - topic: "b2500/1/smartmeter/enabled/set"
      then:
        - b2500.set_adaptive_mode_enabled:
            id: b2500_1
            generation: 2
            enabled: !lambda 'return x == "ON";'
    - topic: "b2500/2/charge_mode/set"
      then:
        - b2500.set_charge_mode:
            id: b2500_2
            charge_mode: !lambda "return x;"
    - topic: "b2500/2/smartmeter/enabled/set"
      then:
        - b2500.set_adaptive_mode_enabled:
            id: b2500_2
            generation: 2
            enabled: !lambda 'return x == "ON";'
  on_json_message:
    - topic: "b2500/1/timer/set"
      then:
        - b2500.set_timer:
            id: b2500_1
            generation: 2
            timer: 0
            enabled: !lambda 'return x["enabled"].is<bool>() ? make_optional(x["enabled"].as<bool>()) : optional<bool>();'
            output_power: !lambda 'return x["outputPower"].is<int>() ? x["outputPower"].as<int>() : optional<int>();'
            start_hour: !lambda 'return x["start"]["hour"].is<int>() ? x["start"]["hour"].as<int>() : optional<int>();'
            start_minute: !lambda 'return x["start"]["minute"].is<int>() ? x["start"]["minute"].as<int>() : optional<int>();'
            end_hour: !lambda 'return x["end"]["hour"].is<int>() ? x["end"]["hour"].as<int>() : optional<int>();'
            end_minute: !lambda 'return x["end"]["minute"].is<int>() ? x["end"]["minute"].as<int>() : optional<int>();'
    - topic: "b2500/1/timer/set"
      then:
        - b2500.set_timer:
