name: ESPHome Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ESPHome
        run: |
          pip install --upgrade pip
          pip install esphome

      - name: Build firmware
        run: |
          esphome compile b2500.yaml

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esphome-firmware
          path: |
            .esphome/build/b2500/.pioenvs/b2500/*.bin
