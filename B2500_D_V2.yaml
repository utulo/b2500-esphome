esphome:
  name: "b2500"
  friendly_name: "B2500"
  devices:
    - id: b2500_device_1
      name: "B2500"
    - id: b2500_device_2
      name: "B2500D"
  on_boot:
    priority: -100
    then:
      - lambda: id(b2500_device_generation_1).publish_state("2");
      - lambda: id(b2500_device_name_1).publish_state("B2500");
      - lambda: id(b2500_device_generation_2).publish_state("2");
      - lambda: id(b2500_device_name_2).publish_state("B2500D");

esp32:
  board: "esp32-s3-devkitc-1"
  variant: "esp32s3"
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
#      CONFIG_FREERTOS_UNICORE: y
      COMPILER_OPTIMIZATION_SIZE: y

psram:
  mode: octal
  speed: 80MHz

# Enable logging
logger:
  level: INFO
ota:
  - platform: esphome
    password: "my_ota_password"
external_components:
  - source:
      type: git
      url: https://github.com/tomquist/esphome-b2500
      ref: "main"
    refresh: 0s
    components: [b2500]

wifi:
  ssid: "doreen1"
  password: "2DP3UGGRU3GZFKLM"
  reboot_timeout: 0s
  power_save_mode: NONE
  fast_connect: True
  manual_ip:
    static_ip: "192.168.178.97"
    gateway: "192.168.178.1"
    subnet: "255.255.255.0"
    dns1: "192.168.178.1"
  on_connect:
    - logger.log:
        level: INFO
        format: "Connected to WiFi. Starting BLE scan."
  on_disconnect:
    - logger.log:
        level: INFO
        format: "Disconnected from WiFi. Stopping BLE scan."
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "ESPHome-b2500"
web_server:
  port: 80
  ota: false
  version: 3
captive_portal:
mqtt:
  id: mqtt_client
  broker: "192.168.178.98"
  port: 1883
  username: "mqtt-user"
  password: "ghmue001"
  discovery: True
  reboot_timeout: 0s
  topic_prefix: "b2500"
  log_topic: "b2500/debug"
  on_connect:
    - logger.log:
        level: INFO
        format: "MQTT connected"
  on_disconnect:
    - logger.log:
        level: INFO
        format: "MQTT disconnected"

b2500:
  - id: b2500_1
    generation: 2
    update_interval: 10s
    ble_client_id: b2500_ble_client_1
    on_cell_info:
      then:
        - lambda: |-
            auto min = x.cell_voltages[0];
            auto max = x.cell_voltages[0];
            int sum = 0;
            for (int i = 0; i < 14; i++) {
              sum += x.cell_voltages[i];
              if (x.cell_voltages[i] < min) {
                min = x.cell_voltages[i];
              }
              if (x.cell_voltages[i] > max) {
                max = x.cell_voltages[i];
              }
            }
            id(b2500_device_cell_voltage_1_1).publish_state(x.cell_voltages[0] / 1000.0);
            id(b2500_device_cell_voltage_1_2).publish_state(x.cell_voltages[1] / 1000.0);
            id(b2500_device_cell_voltage_1_3).publish_state(x.cell_voltages[2] / 1000.0);
            id(b2500_device_cell_voltage_1_4).publish_state(x.cell_voltages[3] / 1000.0);
            id(b2500_device_cell_voltage_1_5).publish_state(x.cell_voltages[4] / 1000.0);
            id(b2500_device_cell_voltage_1_6).publish_state(x.cell_voltages[5] / 1000.0);
            id(b2500_device_cell_voltage_1_7).publish_state(x.cell_voltages[6] / 1000.0);
            id(b2500_device_cell_voltage_1_8).publish_state(x.cell_voltages[7] / 1000.0);
            id(b2500_device_cell_voltage_1_9).publish_state(x.cell_voltages[8] / 1000.0);
            id(b2500_device_cell_voltage_1_10).publish_state(x.cell_voltages[9] / 1000.0);
            id(b2500_device_cell_voltage_1_11).publish_state(x.cell_voltages[10] / 1000.0);
            id(b2500_device_cell_voltage_1_12).publish_state(x.cell_voltages[11] / 1000.0);
            id(b2500_device_cell_voltage_1_13).publish_state(x.cell_voltages[12] / 1000.0);
            id(b2500_device_cell_voltage_1_14).publish_state(x.cell_voltages[13] / 1000.0);
            id(b2500_device_cell_voltage_min_1).publish_state(min / 1000.0);
            id(b2500_device_cell_voltage_max_1).publish_state(max / 1000.0);
            id(b2500_device_cell_voltage_avg_1).publish_state((sum / 14.0) / 1000.0);
            id(b2500_device_cell_voltage_sum_1).publish_state(sum / 1000.0);
            id(b2500_device_cell_voltage_diff_1).publish_state((max - min) / 1000.0);
  - id: b2500_2
    generation: 2
    update_interval: 10s
    ble_client_id: b2500_ble_client_2
    on_cell_info:
      then:
        - lambda: |-
            auto min = x.cell_voltages[0];
            auto max = x.cell_voltages[0];
            int sum = 0;
            for (int i = 0; i < 14; i++) {
              sum += x.cell_voltages[i];
              if (x.cell_voltages[i] < min) {
                min = x.cell_voltages[i];
              }
              if (x.cell_voltages[i] > max) {
                max = x.cell_voltages[i];
              }
            }
            id(b2500_device_cell_voltage_2_1).publish_state(x.cell_voltages[0] / 1000.0);
            id(b2500_device_cell_voltage_2_2).publish_state(x.cell_voltages[1] / 1000.0);
            id(b2500_device_cell_voltage_2_3).publish_state(x.cell_voltages[2] / 1000.0);
            id(b2500_device_cell_voltage_2_4).publish_state(x.cell_voltages[3] / 1000.0);
            id(b2500_device_cell_voltage_2_5).publish_state(x.cell_voltages[4] / 1000.0);
            id(b2500_device_cell_voltage_2_6).publish_state(x.cell_voltages[5] / 1000.0);
            id(b2500_device_cell_voltage_2_7).publish_state(x.cell_voltages[6] / 1000.0);
            id(b2500_device_cell_voltage_2_8).publish_state(x.cell_voltages[7] / 1000.0);
            id(b2500_device_cell_voltage_2_9).publish_state(x.cell_voltages[8] / 1000.0);
            id(b2500_device_cell_voltage_2_10).publish_state(x.cell_voltages[9] / 1000.0);
            id(b2500_device_cell_voltage_2_11).publish_state(x.cell_voltages[10] / 1000.0);
            id(b2500_device_cell_voltage_2_12).publish_state(x.cell_voltages[11] / 1000.0);
            id(b2500_device_cell_voltage_2_13).publish_state(x.cell_voltages[12] / 1000.0);
            id(b2500_device_cell_voltage_2_14).publish_state(x.cell_voltages[13] / 1000.0);
            id(b2500_device_cell_voltage_min_2).publish_state(min / 1000.0);
            id(b2500_device_cell_voltage_max_2).publish_state(max / 1000.0);
            id(b2500_device_cell_voltage_avg_2).publish_state((sum / 14.0) / 1000.0);
            id(b2500_device_cell_voltage_sum_2).publish_state(sum / 1000.0);
            id(b2500_device_cell_voltage_diff_2).publish_state((max - min) / 1000.0);

time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Berlin"

esp32_ble:
  id: ble
  max_connections: 2

esp32_ble_tracker:

ble_client:
  - mac_address: "e8:8d:a6:f3:5b:5b"
    id: b2500_ble_client_1
    on_connect:
      then:
        - logger.log:
            level: INFO
            format: "Connected to BLE device 1 (B2500)"
        - binary_sensor.template.publish:
            id: b2500_device_ble_ok_1
            state: ON
        - delay: 1s
        - b2500.set_datetime:
            id: b2500_1
            datetime: !lambda 'return id(sntp_time).now();'

    on_disconnect:
      then:
        - logger.log:
            level: INFO
            format: "Disconnected from BLE device 1 (B2500)"
        - binary_sensor.template.publish:
            id: b2500_device_ble_ok_1
            state: OFF
  - mac_address: "14:80:cc:fa:55:f7"
    id: b2500_ble_client_2
    on_connect:
      then:
        - logger.log:
            level: INFO
            format: "Connected to BLE device 2 (B2500D)"
        - binary_sensor.template.publish:
            id: b2500_device_ble_ok_2
            state: ON
        - delay: 1s
        - b2500.set_datetime:
            id: b2500_2
            datetime: !lambda 'return id(sntp_time).now();'

    on_disconnect:
      then:
        - logger.log:
            level: INFO
            format: "Disconnected from BLE device 2 (B2500D)"
        - binary_sensor.template.publish:
            id: b2500_device_ble_ok_2
            state: OFF

