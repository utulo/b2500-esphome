script:
  - id: b2500_update_total_power_in
    then:
      - sensor.template.publish:
          id: b2500_total_in_power
          state: !lambda |-
            return id(b2500_total_power_in_1).state + id(b2500_total_power_in_2).state;
  - id: b2500_update_total_power_out
    then:
      - sensor.template.publish:
          id: b2500_total_out_power
          state: !lambda |-
            return id(b2500_total_power_out_1).state + id(b2500_total_power_out_2).state;
  - id: b2500_update_total_daily_energy_in
    then:
      - sensor.template.publish:
          id: b2500_total_daily_energy_in
          state: !lambda |-
            return id(b2500_total_daily_energy_in_1).state + id(b2500_total_daily_energy_in_2).state;
  - id: b2500_update_total_daily_energy_out
    then:
      - sensor.template.publish:
          id: b2500_total_daily_energy_out
          state: !lambda |-
            return id(b2500_total_daily_energy_out_1).state + id(b2500_total_daily_energy_out_2).state;
  - id: b2500_update_total_remaining_capacity
    then:
      - sensor.template.publish:
          id: b2500_total_remaining_capacity
          state: !lambda |-
            return id(b2500_battery_remaining_capacity_1).state + id(b2500_battery_remaining_capacity_2).state;
